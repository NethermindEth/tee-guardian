[workspace]
members = ["crates/common", "crates/peer_registry", "crates/bootstrap", "crates/consensus", "crates/certificates", "crates/guardian"]
resolver = "2"

[workspace.dependencies]
# Cryptographic dependencies
zeroize = { version = "1.7", features = ["zeroize_derive"] }
sha2 = "0.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# HTTP/Web
axum = "0.7"
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.11", features = ["json"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging and metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus = { version = "0.13", features = ["process"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Common utilities
hex = "0.4"
base64 = "0.22"
rand = "0.8"
lazy_static = "1.4"
secp256k1 = { version = "0.29", features = ["rand-std", "global-context"] }

# Confidential Containers dependencies
attester = { git = "https://github.com/confidential-containers/guest-components", tag = "v0.16.0", default-features = false, features = ["tdx-attester", "snp-attester"] }
verifier = { git = "https://github.com/confidential-containers/trustee", tag = "v0.16.0", default-features = false, features = ["tdx-verifier", "snp-verifier"] }
kbs-types = "0.14.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"

# Disable doc tests by default across workspace
[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"

[profile.release]
debug = false
debug-assertions = false
incremental = false
lto = "thin"
codegen-units = 256
opt-level = 3
overflow-checks = true
panic = "abort"
rpath = false
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false
