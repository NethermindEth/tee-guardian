[package]
name = "bootstrap"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Guardian bootstrap and peer trust management for TEE-KMS"

[features]
default = []
# Enable test utilities like TrustedPeerRegistry::init_or_get()
test-utils = []

[dependencies]
# Internal dependencies
peer_registry = { path = "../peer_registry" }
common = { path = "../common", features = ["axum"] }

# TEE attestation
attester = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = "1.0"

# Logging
tracing = { workspace = true }

# Metrics
prometheus = { workspace = true }
lazy_static = { workspace = true }

# Crypto
sha2 = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }

# HTTP client
reqwest = { workspace = true }

# HTTP server
axum = { workspace = true }
tower = { version = "0.4", features = ["timeout"] }
tower-http = { workspace = true }
base64 = { workspace = true }

# Async utilities
async-trait = "0.1"

# Time
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
serial_test = "3.1"
