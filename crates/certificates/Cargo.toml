[package]
name = "certificates"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Certificate Authority for TEE-KMS namespace identity management"

[dependencies]
# Internal crates
common = { path = "../common" }

# Serialization
serde = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Encoding
hex = { workspace = true }
base64 = { workspace = true }

# X.509 certificate parsing with OID registry support
# Same crate used by confidential-containers/trustee for TEE certificate handling
x509-parser = { version = "0.17", features = ["verify"] }

# Logging
tracing = { workspace = true }

[dev-dependencies]
# For test assertions
pretty_assertions = "1.4"
