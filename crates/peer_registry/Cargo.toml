[package]
name = "peer_registry"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Generic peer registry utilities for TEE-based distributed systems"

[dependencies]
# Internal crates
common = { path = "../common" }

# Confidential Containers attestation
attester = { workspace = true }
verifier = { workspace = true }
kbs-types = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# HTTP client
reqwest = { workspace = true }

# Crypto
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }

# Serialization
bincode = "1.3"

# Metrics
prometheus = { workspace = true }
lazy_static = { workspace = true }

# Time
chrono = { workspace = true }

# Async trait support
async-trait = { workspace = true }

[dev-dependencies]
tempfile = "3.8"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
