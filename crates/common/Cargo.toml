[package]
name = "common"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# Serialization
serde.workspace = true
serde_json.workspace = true
hex = { workspace = true }

# Error handling
thiserror.workspace = true

# Security - sensitive data protection
zeroize = { workspace = true }

# Logging and metrics
tracing.workspace = true
tracing-subscriber.workspace = true
prometheus.workspace = true
lazy_static = { workspace = true }
once_cell = "1.19"
chrono.workspace = true

# HTTP client for log push
reqwest = { workspace = true }
tokio.workspace = true
base64 = { workspace = true }

# Rate limiting
governor = "0.6"

# HTTP API (optional, for IntoResponse)
axum = { workspace = true, optional = true }

# Hashing for measurement IDs
sha2 = "0.10"

[features]
default = []
axum = ["dep:axum"]

# Cannot use workspace lints due to need to override unsafe_code
[lints.rust]
# Override workspace setting to allow unsafe code in sensitive.rs for zeroization
unsafe_code = "warn"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"
