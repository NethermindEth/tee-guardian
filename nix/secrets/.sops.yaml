# SOPS Configuration
#
# Defines which age keys can encrypt/decrypt each secrets file.

keys:
  # === Developer Keys ===
  - &dev_elicb_laptop age1fd7u2ec88u5v74q3qj8dxrsaw2f4md9lnt0klnr9vf74exr603mqw3qhey

  # === Server Keys ===
  # - &server_hetzner_sev PLACEHOLDER_HETZNER_SEV
  # - &server_open_metal_tdx PLACEHOLDER_OPEN_METAL_TDX

creation_rules:
  - path_regex: hetzner-sev-dev\.yaml$
    key_groups:
      - age:
          - *dev_elicb_laptop
          # - *server_hetzner_sev

  - path_regex: open-metal-tdx-dev\.yaml$
    key_groups:
      - age:
          - *dev_elicb_laptop
          # - *server_open_metal_tdx

  - path_regex: ovh-tdx-development\.yaml$
    key_groups:
      - age:
          - *dev_elicb_laptop

  # Shared secrets (accessible by all hosts)
  - path_regex: shared\.yaml$
    key_groups:
      - age:
          - *dev_elicb_laptop
          # - *server_hetzner_sev
          # - *server_open_metal_tdx
