# Guardian Registry Proxy Configuration
#
# Routes requests to per-cluster registry backends based on source IP.
#
# Cluster mapping:
#   192.168.122.20-29   -> registry-cluster-0
#   192.168.122.30-39   -> registry-cluster-1
#   ...
#   192.168.122.110-119 -> registry-cluster-9
#
# Formula: cluster_id = floor((last_octet - 20) / 10)

resolver 127.0.0.11 valid=10s ipv6=off;

log_format cluster_log '$remote_addr -> cluster-$cluster_id [$time_local] '
                       '"$request" $status $body_bytes_sent';

server {
    listen 9000;
    access_log /dev/stdout cluster_log;
    error_log /dev/stderr warn;

    set $cluster_id "0";
    set $backend "registry-cluster-0";

    location / {
        access_by_lua_block {
            local ip = ngx.var.remote_addr
            local octet = tonumber(ip:match("%.(%d+)$")) or 0
            local cluster = math.floor((octet - 20) / 10)

            -- Clamp to valid range [0, 9]
            if cluster < 0 then cluster = 0 end
            if cluster > 9 then cluster = 9 end

            ngx.var.cluster_id = tostring(cluster)
            ngx.var.backend = "registry-cluster-" .. cluster
        }

        proxy_pass http://$backend:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Cluster-ID $cluster_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /health {
        return 200 '{"status": "healthy", "service": "registry-proxy"}';
        add_header Content-Type application/json;
    }
}
