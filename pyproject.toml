[project]
name = "tee-guardian"
version = "0.1.0"
description = "Simplified TDX Guardian CLI for Nix-based development"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0.0",
    "paramiko>=3.0.0",
    "pyyaml>=6.0.0",
    "rich>=14.2.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
registry = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.3",
]

[project.scripts]
guardian = "guardian_cli.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["guardian_cli"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
test = [
    "pytest>=7.4.0",
    "pytest-xdist>=3.3.0",
    "requests>=2.31.0",
    "docker>=6.1.0",
    "polars>=1.0.0",
]
